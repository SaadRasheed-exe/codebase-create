[pytest]
# ROS 2 (sourced via PYTHONPATH) registers global pytest plugins that
# fail to import outside a ROS environment. Suppress them so the suite
# runs from any shell.
addopts =
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
    -p no:launch_ros
    -p no:launch_testing
